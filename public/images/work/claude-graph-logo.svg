<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e2235"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bg)" stroke="#2a2d3d" stroke-width="1.5"/>

  <!-- Graph edges -->
  <g stroke-width="1.5" stroke-linecap="round" opacity="0.5">
    <line x1="60" y1="60" x2="60" y2="28" stroke="#6ea8fe"/>
    <line x1="60" y1="60" x2="88" y2="75" stroke="#6ea8fe"/>
    <line x1="60" y1="60" x2="32" y2="75" stroke="#6ea8fe"/>
    <line x1="60" y1="28" x2="88" y2="75" stroke="#7ee787" stroke-dasharray="3 2"/>
    <line x1="32" y1="75" x2="88" y2="75" stroke="#f2b880" stroke-dasharray="3 2"/>
    <line x1="60" y1="28" x2="38" y2="40" stroke="#6ea8fe"/>
    <line x1="60" y1="28" x2="82" y2="40" stroke="#6ea8fe"/>
  </g>

  <!-- Nodes -->
  <!-- Center node (function, blue) -->
  <circle cx="60" cy="60" r="9" fill="#1a1d27" stroke="#6ea8fe" stroke-width="2" filter="url(#glow)"/>
  <circle cx="60" cy="60" r="5" fill="#6ea8fe"/>

  <!-- Top node (class, orange) -->
  <circle cx="60" cy="28" r="7" fill="#1a1d27" stroke="#f2b880" stroke-width="2"/>
  <circle cx="60" cy="28" r="4" fill="#f2b880"/>

  <!-- Bottom-right node (function, blue) -->
  <circle cx="88" cy="75" r="6" fill="#1a1d27" stroke="#6ea8fe" stroke-width="1.5"/>
  <circle cx="88" cy="75" r="3.5" fill="#6ea8fe"/>

  <!-- Bottom-left node (module, green) -->
  <circle cx="32" cy="75" r="6" fill="#1a1d27" stroke="#7ee787" stroke-width="1.5"/>
  <circle cx="32" cy="75" r="3.5" fill="#7ee787"/>

  <!-- Small satellite nodes -->
  <circle cx="38" cy="40" r="4.5" fill="#1a1d27" stroke="#6ea8fe" stroke-width="1.5"/>
  <circle cx="38" cy="40" r="2.5" fill="#6ea8fe" opacity="0.7"/>

  <circle cx="82" cy="40" r="4.5" fill="#1a1d27" stroke="#f2b880" stroke-width="1.5"/>
  <circle cx="82" cy="40" r="2.5" fill="#f2b880" opacity="0.7"/>
</svg>
