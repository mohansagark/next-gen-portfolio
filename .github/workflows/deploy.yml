name: 🚀 Deploy Portfolio

on:
  push:
    branches: [master]
  workflow_dispatch: # Allow manual triggering

jobs:
  staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "yarn"

      - name: 📥 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🏗️ Build Next.js static site
        run: |
          yarn build
          yarn export
        env:
          NODE_ENV: production

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: next-static-export
          path: out/
          retention-days: 7

      - name: 🚀 Deploy to Vercel (Staging)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./out
          scope: ${{ secrets.VERCEL_ORG_ID }}
          vercel-args: --y

      - name: ✅ Staging deployment complete
        run: |
          echo "🎉 Staging deployment successful!"
          echo "📍 Preview URL: https://your-project.vercel.app"

  production:
    name: 🛑 Deploy to Production
    runs-on: ubuntu-latest
    needs: staging
    environment: production # This creates the approval requirement

    steps:
      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: next-static-export
          path: out/

      - name: 📂 List build contents
        run: |
          echo "📋 Build contents:"
          ls -la out/

      - name: 🌐 Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.next/**
            **/.env*
            **/README.md

      - name: 🧹 Cleanup FTP deployment
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /public_html/
          dangerous-clean-slate: false # Don't delete all files, just sync

      - name: ✅ Production deployment complete
        run: |
          echo "🎉 Production deployment successful!"
          echo "🌍 Live URL: https://your-domain.com"
          echo "⏰ Deployed at: $(date)"

      - name: 📧 Notify deployment success
        if: success()
        run: |
          echo "✨ Portfolio successfully deployed to production!"
          echo "🔗 Your portfolio is now live and accessible to users."

      - name: ❌ Handle deployment failure
        if: failure()
        run: |
          echo "💥 Production deployment failed!"
          echo "🔍 Please check the logs above for details."
          exit 1
